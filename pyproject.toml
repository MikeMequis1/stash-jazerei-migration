[project]
name = "stash-jazerei-migration"
version = "0.1.0"
description = "Ferramenta local e auditavel para migrar dados do Stash para o Ja Zerei"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
browser = ["playwright>=1.45,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
